<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>لوحة تحكم English with Osama</title><style>:root{--b:#0866d9;--bd:#062d6b;--p:#eaf4ff;--line:#d8e7f8;--ink:#10213f}*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:linear-gradient(180deg,#f7fbff,#edf6ff);margin:0;color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:28px 18px}h1{color:var(--bd)}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tabs button{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#0750a8}.tabs button:hover{background:var(--p)}.panel{background:#fffffffa;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:15px;box-shadow:0 10px 30px #083d8212}.item{padding:15px;border-bottom:1px solid #edf2f8}.item:last-child{border:0}input,select,textarea{padding:12px;border:1px solid #cbdcf1;border-radius:11px;margin:5px;width:calc(100% - 10px);font:inherit}textarea{min-height:90px}.primary{background:linear-gradient(135deg,#0757c7,#3190ff);color:#fff;border:0;padding:12px 17px;border-radius:11px;cursor:pointer;font-weight:800}.danger{background:#fff0f0;color:#b42318;border:0;padding:9px 12px;border-radius:9px;cursor:pointer}.small{color:#667085;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.box{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.notice{padding:12px;background:#edf6ff;color:#0750a8;border:1px solid #d8eaff;border-radius:11px;margin:10px 0}.uploadBox{display:none;margin:12px 5px;padding:14px;border:1px solid #cfe1fb;border-radius:13px;background:#f7fbff}.progressTrack{height:18px;background:#e7eef8;border-radius:999px;overflow:hidden;direction:ltr}.progressBar{height:100%;width:0%;background:linear-gradient(90deg,#0757c7,#5b9cff);transition:width .15s ease}.progressMeta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px}.percent{font-weight:800;color:#0757c7}.cancelBtn{margin-top:10px;background:#fff;border:1px solid #cbd5e1;color:#344054;padding:8px 12px;border-radius:8px;cursor:pointer}@media(max-width:600px){.row{display:block}}</style></head><body><div class="wrap"><div class="row"><div><h1>👨‍🏫 لوحة تحكم English with Osama</h1><p class="small" id="who">جاري التحقق...</p></div><button class="primary" onclick="location.href='index.html'">العودة للمنصة</button></div><div class="tabs"><button onclick="tab('students')">👨‍🎓 الطلاب</button><button onclick="tab('courses')">📚 الكورسات</button><button onclick="tab('lessons')">🎬 الدروس</button><button onclick="tab('enrollments')">🔐 الاشتراكات</button><button onclick="tab('team')">👥 فريق العمل</button></div><div id="panel" class="panel"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let me=null;
const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return}const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||!data||data.role!=='teacher'){document.getElementById('panel').innerHTML='<div class="notice">هذا الحساب ليس حساب مدرس.</div>';document.getElementById('who').textContent='لا توجد صلاحية مدرس';return}me=data;document.getElementById('who').textContent='مرحباً '+data.full_name;tab('students')}
function field(id,label,ph){return `<label>${label}</label><input id="${id}" placeholder="${ph||''}">`}
function val(id){return document.getElementById(id)?.value.trim()||''}
async function tab(t){if(!me)return; if(t==='students')return students();if(t==='courses')return courses();if(t==='lessons')return lessons();if(t==='enrollments')return enrollments();if(t==='team')return team()}
async function students(){const {data,error}=await sb.from('profiles').select('*').eq('role','student').order('created_at',{ascending:false});document.getElementById('panel').innerHTML='<h2>👨‍🎓 الطلاب</h2>'+ (error?'<div class="notice">'+esc(error.message)+'</div>':(data||[]).map(x=>`<div class="item"><b>${esc(x.full_name)}</b><div class="small">البريد مرتبط بحساب Auth — كود الطالب: ${esc(x.student_code||'غير محدد')}</div></div>`).join('')||'<p class="small">لا يوجد طلاب بعد.</p>')}
async function courses(){const {data,error}=await sb.from('courses').select('*').order('id');document.getElementById('panel').innerHTML='<h2>📚 الكورسات</h2><div class="box">'+field('ct','اسم الكورس','كورس الكيمياء')+field('cd','الوصف','شرح المنهج...')+field('cp','السعر','300')+'<label><input id="cf" type="checkbox" style="width:auto"> كورس مجاني</label><button class="primary" onclick="addCourse()">إضافة الكورس</button></div><div class="grid" style="margin-top:15px">'+((data||[]).map(c=>`<div class="box"><b>${esc(c.title)}</b><p class="small">${esc(c.description||'')}</p><p>${c.is_free?'مجاني':Number(c.price||0)+' جنيه'}</p><button class="danger" onclick="delCourse(${c.id})">حذف</button></div>`).join('')||'<p>لا توجد كورسات.</p>')+'</div>'}
async function addCourse(){const title=val('ct'),description=val('cd'),price=Number(val('cp')||0),is_free=document.getElementById('cf').checked;if(!title)return alert('اكتب اسم الكورس.');const {error}=await sb.from('courses').insert({title,description,price,is_free});if(error)alert(error.message);else tab('courses')}
async function delCourse(id){if(!confirm('حذف الكورس وكل دروسه؟'))return;const {error}=await sb.from('courses').delete().eq('id',id);if(error)alert(error.message);else tab('courses')}
async function lessons(){
 const [{data:courses,error:cErr},{data:lessons,error:lErr}]=await Promise.all([
   sb.from('courses').select('id,title').order('id'),
   sb.from('lessons').select('*').order('course_id').order('sort_order')
 ]);
 const panel=document.getElementById('panel');
 if(cErr||lErr){
   panel.innerHTML='<h2>🎬 الدروس</h2><div class="notice">تعذر تحميل البيانات: '+esc((cErr||lErr).message)+'</div>';
   return;
 }
 panel.innerHTML='<h2>🎬 الدروس</h2><div class="box">'
   +'<label>الكورس</label><select id="lc">'+(courses||[]).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')+'</select>'
   +field('lt','اسم الدرس','الباب الأول')
   +'<label>ملف الفيديو</label><input id="videoFile" type="file" accept="video/*">'
   +'<div class="small">يفضل MP4. للفيديوهات الكبيرة قد يستغرق الرفع بعض الوقت.</div>'
   +field('lv','أو رابط فيديو خارجي (اختياري)','https://...')
   +field('lp','رابط PDF (اختياري)','https://...')
   +field('ls','الترتيب','1')
   +'<div id="lessonStatus" class="notice" style="display:none"></div>'
   +'<div id="uploadBox" class="uploadBox">'
   +'<div><b id="uploadText">رفع الفيديو</b></div>'
   +'<div class="progressTrack" style="margin-top:10px"><div id="uploadProgress" class="progressBar"></div></div>'
   +'<div class="progressMeta"><span id="uploadBytes">0 / 0 MB</span><span id="uploadPercent" class="percent">0%</span></div>'
   +'<button id="cancelUploadBtn" type="button" class="cancelBtn" onclick="cancelVideoUpload()">إلغاء الرفع</button>'
   +'</div>'
   +'<button id="addLessonBtn" class="primary" onclick="addLesson()">إضافة الدرس</button>'
   +'</div><div style="margin-top:15px">'
   +((lessons||[]).map(l=>`<div class="item"><b>${esc(l.title)}</b><div class="small">${esc(l.video_url||'بدون فيديو')} — ${esc(l.pdf_path||'بدون PDF')}</div><button class="danger" onclick="delLesson(${l.id})">حذف</button></div>`).join('')||'<p>لا توجد دروس.</p>')
   +'</div>';
}

function lessonStatus(text,show=true){
 const el=document.getElementById('lessonStatus');
 if(!el)return;
 el.textContent=text;
 el.style.display=show?'block':'none';
}

let activeTusUpload=null;

function setUploadUI(show, percent=0, uploaded=0, total=0, text='رفع الفيديو'){
 const box=document.getElementById('uploadBox');
 if(!box)return;
 box.style.display=show?'block':'none';
 const bar=document.getElementById('uploadProgress');
 const pct=document.getElementById('uploadPercent');
 const bytes=document.getElementById('uploadBytes');
 const label=document.getElementById('uploadText');
 if(bar)bar.style.width=Math.max(0,Math.min(100,percent))+'%';
 if(pct)pct.textContent=Math.round(percent)+'%';
 if(bytes)bytes.textContent=(uploaded/1024/1024).toFixed(1)+' / '+(total/1024/1024).toFixed(1)+' MB';
 if(label)label.textContent=text;
}

function cancelVideoUpload(){
 if(activeTusUpload){
   try{activeTusUpload.abort();}catch(e){console.warn(e)}
 }
 activeTusUpload=null;
 const btn=document.getElementById('addLessonBtn');
 if(btn){btn.disabled=false;btn.textContent='إضافة الدرس';}
 lessonStatus('تم إلغاء رفع الفيديو.');
 setUploadUI(false);
}

async function uploadVideoWithProgress(file,path){
 const {data:{session},error:sessionError}=await sb.auth.getSession();
 if(sessionError||!session?.access_token)throw new Error('انتهت جلسة تسجيل الدخول. سجّل الدخول مرة أخرى.');
 if(typeof tus==='undefined')throw new Error('تعذر تحميل محرك رفع الفيديو. تحقق من الإنترنت ثم أعد تحميل الصفحة.');
 const projectRef=new URL(SUPABASE_URL).hostname.split('.')[0];
 const endpoint=`https://${projectRef}.storage.supabase.co/storage/v1/upload/resumable`;
 if(!projectRef)throw new Error('رابط Supabase غير صحيح.');
 setUploadUI(true,0,0,file.size,'جاري رفع الفيديو');
 return await new Promise((resolve,reject)=>{
   let finished=false;
   const upload=new tus.Upload(file,{
     endpoint,
     retryDelays:[0,3000,5000,10000,20000],
     headers:{authorization:`Bearer ${session.access_token}`,'x-upsert':'true'},
     uploadDataDuringCreation:true,
     removeFingerprintOnSuccess:true,
     chunkSize:6*1024*1024,
     metadata:{bucketName:'course-videos',objectName:path,contentType:file.type||'video/mp4',cacheControl:'3600'},
     onError(error){activeTusUpload=null; if(!finished){ setUploadUI(true,0,0,file.size,'❌ فشل رفع الفيديو'); reject(error)}},
     onProgress(bytesUploaded,bytesTotal){const percent=bytesTotal?bytesUploaded/bytesTotal*100:0;setUploadUI(true,percent,bytesUploaded,bytesTotal,'جاري رفع الفيديو')},
     onSuccess(){finished=true;activeTusUpload=null;setUploadUI(true,100,file.size,file.size,'اكتمل رفع الفيديو');resolve()}
   });
   activeTusUpload=upload;
   upload.findPreviousUploads().then(previousUploads=>{
     if(previousUploads.length){
       upload.resumeFromPreviousUpload(previousUploads[0]);
       lessonStatus('تم العثور على رفع سابق — استكمال الرفع...');
     }
     return upload.start();
   }).catch(error=>{activeTusUpload=null;setUploadUI(true,0,0,file.size,'❌ تعذر بدء رفع الفيديو');reject(error)});
 });
}

async function addLesson(){
 const btn=document.getElementById('addLessonBtn');
 try{
   const course_id=Number(val('lc')),title=val('lt'),externalUrl=val('lv'),pdf_path=val('lp')||null,sort_order=Number(val('ls')||0),file=document.getElementById('videoFile')?.files?.[0];
   if(!course_id)return alert('اختار الكورس أولاً.');
   if(!title)return alert('اكتب اسم الدرس.');
   if(!file&&!externalUrl)return alert('اختر ملف فيديو أو اكتب رابط فيديو.');
   if(file&&!file.type.startsWith('video/'))return alert('الملف المختار ليس فيديو.');
   if(btn){btn.disabled=true;btn.textContent='جاري الرفع...';}
   lessonStatus(file?'جاري تجهيز رفع الفيديو...':'جاري إضافة الدرس...');
   let video_url=externalUrl||null,uploadedPath=null;
   if(file){
     const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
     const path=course_id+'/'+Date.now()+'_'+safeName;
     uploadedPath=path;
     await uploadVideoWithProgress(file,path);
     video_url='storage:'+path;
     lessonStatus('تم رفع الفيديو 100%. جاري حفظ بيانات الدرس...');
   }
   const {error}=await sb.from('lessons').insert({course_id,title,video_url,pdf_path,sort_order});
   if(error){if(uploadedPath)await sb.storage.from('course-videos').remove([uploadedPath]);throw new Error('تم رفع الفيديو لكن تعذر إنشاء الدرس في قاعدة البيانات: '+error.message)}
   lessonStatus('✅ تم إنشاء الدرس ورفع الفيديو بنجاح.');
   setTimeout(()=>tab('lessons'),700);
 }catch(err){
   console.error('addLesson error:',err);
   if(activeTusUpload){try{activeTusUpload.abort()}catch(e){}}
   activeTusUpload=null;
   lessonStatus('❌ '+(err?.message||'حدث خطأ غير معروف'));
   alert(err?.message||'حدث خطأ أثناء إضافة الدرس.');
 }finally{
   if(btn){btn.disabled=false;btn.textContent='إضافة الدرس';}
 }
}

async function delLesson(id){if(!confirm('حذف الدرس؟'))return;const {error}=await sb.from('lessons').delete().eq('id',id);if(error)alert(error.message);else tab('lessons')}
async function enrollments(){const [{data:s},{data:c},{data:e,error}]=await Promise.all([sb.from('profiles').select('id,full_name,student_code').eq('role','student').order('full_name'),sb.from('courses').select('id,title').order('id'),sb.from('enrollments').select('*').order('created_at',{ascending:false})]);document.getElementById('panel').innerHTML='<h2>🔐 منح صلاحية كورس</h2><div class="box"><label>الطالب</label><select id="es">'+(s||[]).map(x=>`<option value="${x.id}">${esc(x.full_name)} — ${esc(x.student_code||'بدون كود')}</option>`).join('')+'</select><label>الكورس</label><select id="ec">'+(c||[]).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')+'</select><button class="primary" onclick="grant()">منح الاشتراك</button></div><div style="margin-top:15px">'+((e||[]).map(x=>`<div class="item">طالب: ${esc((s||[]).find(a=>a.id===x.student_id)?.full_name||x.student_id)} — كورس: ${esc((c||[]).find(a=>a.id===x.course_id)?.title||x.course_id)} <button class="danger" onclick="revoke(${x.id})">إلغاء</button></div>`).join('')||'<p>لا توجد اشتراكات.</p>')+'</div>'+(error?'<div class="notice">'+esc(error.message)+'</div>':'')}
async function grant(){const student_id=val('es'),course_id=Number(val('ec'));const {error}=await sb.from('enrollments').upsert({student_id,course_id},{onConflict:'student_id,course_id'});if(error)alert(error.message);else tab('enrollments')}
async function revoke(id){if(!confirm('إلغاء الاشتراك؟'))return;const {error}=await sb.from('enrollments').delete().eq('id',id);if(error)alert(error.message);else tab('enrollments')}
async function team(){const {data,error}=await sb.from('team_members').select('*').order('id');document.getElementById('panel').innerHTML='<h2>👥 فريق العمل</h2><div class="box">'+field('tn','اسم العضو','الأستاذ الرئيسي')+field('tr','الوظيفة','المدرس والمسؤول الرئيسي')+field('ti','الأيقونة','👨‍🏫')+'<button class="primary" onclick="addTeam()">إضافة عضو</button></div><div class="grid" style="margin-top:15px">'+((data||[]).map(x=>`<div class="box"><div style="font-size:32px">${esc(x.icon||'👤')}</div><b>${esc(x.name)}</b><p class="small">${esc(x.role_title)}</p><button class="danger" onclick="delTeam(${x.id})">حذف</button></div>`).join('')||'<p>لا يوجد أعضاء.</p>')+'</div>'+(error?'<div class="notice">'+esc(error.message)+'</div>':'')}
async function addTeam(){const name=val('tn'),role_title=val('tr'),icon=val('ti')||'👤';if(!name||!role_title)return alert('اكتب الاسم والوظيفة.');const {error}=await sb.from('team_members').insert({name,role_title,icon,permission:'support'});if(error)alert(error.message);else tab('team')}
async function delTeam(id){if(!confirm('حذف العضو؟'))return;const {error}=await sb.from('team_members').delete().eq('id',id);if(error)alert(error.message);else tab('team')}
init();
</script></body></html>
